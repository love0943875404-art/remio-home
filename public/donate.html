    <title>捐赠</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #111827;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #1f2937;
            padding: 32px;
            border-radius: 16px;
            text-align: center;
            max-width: 360px;
            width: 100%;
        }
        h2 {
            margin-bottom: 12px;
            font-size: 22px;
        }
        .tip {
            color: #9ca3af;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .qrcode {
            width: 240px;
            height: auto;
            margin: 0 auto 20px;
            border-radius: 12px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 24px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
        .back-btn:hover {
            background: #2563eb;
        }
    </style>
</head>
